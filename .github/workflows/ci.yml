name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Rebuild everything from data/
        run: python src/run_all.py
      - name: Text outputs are unchanged
        run: |
          git diff --exit-code --stat -- reports \
            || (echo "::error::Rebuilding changed a committed output - the pipeline is not deterministic" && exit 1)
      - name: The workbook has the same content
        run: python src/deterministic.py --check deliverables/ai_act_hr_register.xlsx
      - name: Tests
        run: pytest -q

  workbook:
    # The register recalculated by a real spreadsheet engine and checked against Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice and the model
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc
          pip install -r requirements.txt
      - name: Recalculate the workbook
        run: python src/recalc_libreoffice.py deliverables/ai_act_hr_register.xlsx build/
      - name: Every formula matches Python
        run: python src/check_workbook.py build/ai_act_hr_register.xlsx
